<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmoryDev</title>
<meta name="description" content="Apps and games by AmoryDev.">
<style>
  :root { --bg: #faf8f4; --ink: #1d1b18; --muted: #6b665e; --line: #e4dfd6; --link: #2f5fb3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161513; --ink: #eeebe5; --muted: #a39e95; --line: #2e2b27; --link: #8fb3f0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 32px 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .name { font-weight: 600; }
  .links { font-size: 14px; color: var(--muted); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>AmoryDev</h1>
  <p class="lead">Small apps and games for Android.</p>

  <h2>Apps</h2>
  <ul>
    <li>
      <div class="name">LED Scroller – Neon LED Banner</div>
      <div class="links"><a href="https://play.google.com/store/apps/details?id=kmp.amory.ledscrollapp">Google Play</a></div>
    </li>
    <li>
      <div class="name">Blend Loop: Color Mix Puzzle</div>
      <div class="links">Coming soon ·
        <a href="https://amorydev.github.io/blendloop-legal/privacy-policy">Privacy policy</a> ·
        <a href="https://amorydev.github.io/blendloop-legal/delete-data">Delete your data</a></div>
    </li>
  </ul>

  <h2>Contact</h2>
  <p><a href="mailto:amory.dev@gmail.com">amory.dev@gmail.com</a></p>
</main>
</body>
</html>
